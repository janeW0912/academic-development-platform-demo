<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目记录与学期复盘</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
    <a href="../" style="position:fixed;right:16px;bottom:16px;z-index:1000;padding:8px 12px;border-radius:6px;background:#fff;color:#77100e;border:1px solid #77100e;font:14px system-ui">返回平台首页</a>
  <a href="#projects" class="skip-link">跳转到项目列表</a>
  <header class="site-header">
    <a class="brand" href="#top"><svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5v6"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>统计学院<strong>学业进度</strong></span></a>
    <nav aria-label="页面导航"><a href="#projects" id="header-projects">项目记录</a><a href="#projects" id="header-review">学期复盘</a><button class="text-button" id="header-resume">整理简历</button></nav>
    <span class="local-label"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5-2 8-5.5 8-10V5l-8-3-8 3v7c0 4.5 3 8 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>本地保存</span>
  </header>
  <main id="top">
    <section class="hero-section" aria-labelledby="page-title">
      <div class="hero-copy"><h1 id="page-title">项目记录与学期复盘</h1><p>记录课程作业、科研和比赛，期末整理成简历经历。</p></div>
      <div class="upload-panel term-panel">
        <div class="upload-heading"><h2>学期工作台</h2></div>
        <label class="field">当前学期<select id="term" aria-label="学期"></select></label>
        <div class="upload-actions"><button class="text-button" id="new-term">添加学期</button><button class="primary-button" id="new-project">新建项目</button></div>
      </div>
    </section>
    <section class="metrics-section" aria-label="学期摘要" id="metrics"></section>
    <section class="curriculum-section" id="projects" aria-labelledby="list-title">
      <aside class="curriculum-sidebar">
        <div class="sidebar-heading"><h2>项目分类</h2></div>
        <nav class="module-nav" id="nav" aria-label="项目导航"></nav>
        <div class="backup"><button class="text-button" id="backup">备份数据</button><button class="text-button" id="restore">恢复备份</button><input type="file" id="backup-file" accept=".json,application/json" hidden></div>
      </aside>
      <section class="curriculum-content">
        <div class="toolbar"><h2 id="list-title">全部项目</h2><button class="text-button" id="resume">整理简历</button></div>
        <div class="course-toolbar filters"><input id="search" type="search" placeholder="搜索项目、角色或成果" aria-label="搜索项目"><select id="filter" aria-label="复盘状态"><option value="all">全部复盘状态</option><option value="pending">待复盘</option><option value="reviewed">已复盘</option></select></div>
        <div id="list"></div>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
